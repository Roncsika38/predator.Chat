<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predator Chat</title>
<meta name="description" content="Predator Chat – magyar online közösségi chat, chatszobákkal, profilokkal és üzenetküldéssel.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://roncsika38.github.io/predator.Chat/">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #09090c;
  --panel: #15151b;
  --red: #ed2438;
  --red2: #b80f24;
  --text: #f5f5f7;
  --muted: #aaaab5;
  --line: #34343e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #291017, #09090c 65%);
  color: var(--text);
  font: 16px/1.45 Arial, sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  min-height: 70px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #08080a;
  border-bottom: 2px solid var(--red);
}
h1 { font-size: 24px; margin: 0; }
h1 span { color: var(--red); }
#userbar { font-size: 12px; color: var(--muted); }
button, input, select { font: inherit; border-radius: 10px; }
button {
  padding: 11px 14px;
  background: linear-gradient(135deg, #f12b40, #b20e24);
  border: 0;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
button:disabled { opacity: .55; cursor: wait; }
input, select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: #101014;
  color: white;
  border: 1px solid #414149;
}
main { max-width: 1500px; margin: 14px auto; padding: 0 12px; }
.panel {
  background: linear-gradient(145deg, #19191f, #111115);
  border: 1px solid #38252d;
  border-radius: 14px;
  padding: 14px;
}
.auth { max-width: 440px; margin: 25px auto; }
.form { display: grid; gap: 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1; }
.tabs {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  background: #101014;
  border: 1px solid #38252d;
  border-radius: 14px;
  padding: 6px;
  margin-bottom: 10px;
}
.tabs button { flex: 0 0 auto; background: transparent; color: #ddd; }
.tabs button.active { background: var(--red); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
#status, #chatStatus, #avatarStatus, #roomAdminStatus, #roleStatus {
  white-space: pre-wrap;
  color: #ff9aa8;
  font-size: 13px;
}
.predator-layout {
  display: grid;
  grid-template-columns: minmax(200px,.8fr) minmax(350px,2.3fr) minmax(220px,.9fr);
  gap: 10px;
  align-items: stretch;
}
.predator-layout > .panel { min-width: 0; min-height: 65vh; }
#rooms { display: flex; flex-direction: column; gap: 8px; }
#rooms button { width: 100%; text-align: left; background: #17171b; border: 1px solid #30252b; }
#rooms button.active { background: #8f0717; border-color: var(--red); }
.chat-center { display: flex; flex-direction: column; }
#roomTitle { font-size: 22px; color: #ff5368; margin: 8px 0; }
#messages {
  height: 55vh;
  min-height: 280px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 8px 4px;
}
.msg {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 5px;
  border-bottom: 1px solid #30272f;
  overflow-wrap: anywhere;
}
.msg-avatar {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #bd2338;
}
.msg-content { min-width: 0; flex: 1; }
.msg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.msg .time { color: var(--muted); font-size: 11px; }
.msg-content .message-body { margin-top: 4px; white-space: pre-wrap; }
.msg:nth-child(5n+1) .msg-head b { color: #ff5b70; }
.msg:nth-child(5n+2) .msg-head b { color: #47d7ff; }
.msg:nth-child(5n+3) .msg-head b { color: #c39aff; }
.msg:nth-child(5n+4) .msg-head b { color: #71e3a3; }
.msg:nth-child(5n+5) .msg-head b { color: #ffc46b; }
.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  padding: 6px;
  background: #0b0b0e;
  border: 1px solid #49232c;
  border-radius: 22px;
}
.composer input { flex: 1; min-width: 0; }
.image-send { cursor: pointer; padding: 8px; }
.message-image {
  display: block;
  max-width: min(100%,420px);
  max-height: 320px;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 8px;
}
.member-list { display: grid; gap: 8px; }
.member-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #111114;
}
.member-item img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
}
.member-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.avatar {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin-bottom: 12px;
  border: 2px solid var(--red);
}
.private-layout {
  display: grid;
  grid-template-columns: minmax(160px,.7fr) minmax(0,1.3fr);
  gap: 12px;
}
.private-messages { height: 40vh; min-height: 220px; overflow: auto; padding: 8px; }
.private-compose { display: flex; gap: 8px; margin-top: 8px; }
.private-compose input { flex: 1; }
@media(max-width:850px) {
  .predator-layout { grid-template-columns: 1fr; }
  .predator-layout > .panel { min-height: auto; }
  #messages { height: 45vh; }
  header { padding: 10px; }
  h1 { font-size: 19px; }
  .private-layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>🔴 Predator <span>Chat</span></h1>
  <div id="userbar" class="muted">Nincs bejelentkezve</div>
  <button id="logout" class="hidden" type="button">Kilépés</button>
</header>
<main>
<section id="auth" class="panel auth">
  <div id="normalAuth">
    <h2>Belépés / Regisztráció</h2>
    <form id="authform" class="form">
      <input id="displayName" maxlength="32" placeholder="Felhasználónév regisztrációhoz" autocomplete="nickname">
      <input id="email" type="email" placeholder="E-mail-cím" required autocomplete="email">
      <input id="password" type="password" placeholder="Jelszó (legalább 6 karakter)" minlength="6" required autocomplete="current-password">
      <div class="actions">
        <button type="submit">Bejelentkezés</button>
        <button type="button" id="register">Regisztráció</button>
      </div>
      <button type="button" id="forgotPassword">Elfelejtett jelszó?</button>
    </form>
  </div>
  <div id="recoveryForm" class="hidden">
    <h2>Új jelszó beállítása</h2>
    <form id="newPasswordForm" class="form">
      <input id="newPassword" type="password" minlength="6" placeholder="Új jelszó" required>
      <input id="newPasswordAgain" type="password" minlength="6" placeholder="Új jelszó még egyszer" required>
      <button type="submit">Jelszó mentése</button>
    </form>
  </div>
  <p id="status" role="status"></p>
</section>
<section id="app" class="hidden">
<nav class="tabs">
  <button class="active" data-tab="chat">💬 Chat</button>
  <button data-tab="members">👥 Tagok</button>
  <button data-tab="private">✉ Üzenetek</button>
  <button data-tab="profile">👤 Profil</button>
  <button data-tab="admin" id="adminTab" class="hidden">⚙ Admin</button>
</nav>
<section id="chat">
<div class="predator-layout">
  <aside class="panel">
    <h3>🔴 Szobák</h3>
    <div id="rooms"></div>
  </aside>
  <main class="panel chat-center">
    <h3>💬 Beszélgetés</h3>
    <div id="roomTitle">Válassz szobát</div>
    <div id="messages"></div>
    <p id="chatStatus" class="muted small"></p>
    <form id="sendForm" class="composer">
      <input id="message" maxlength="2000" placeholder="Írd ide az üzeneted..." required>
      <label class="image-send" for="chatImageFile" title="Kép küldése">🖼️</label>
      <input id="chatImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
      <button type="submit">Küldés</button>
    </form>
  </main>
  <aside class="panel">
    <h3>🟢 Tagok</h3>
    <p id="onlineMembersStatus" class="muted small">Tagok betöltése...</p>
    <div id="onlineMemberList" class="member-list"></div>
  </aside>
</div>
</section>
